# Local development configuration for `supabase start`.
# Ports are offset from the CLI defaults (543xx -> 544xx) so this stack can run
# alongside other local Supabase projects.
project_id = "sauti-salama"

[api]
port = 54421

[db]
port = 54422
shadow_port = 54420
major_version = 17

[db.pooler]
port = 54429

[studio]
port = 54423

[local_smtp]
port = 54424

[analytics]
port = 54427

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**", "http://127.0.0.1:3000/**"]

[auth.email]
enable_confirmations = true
otp_length = 6
otp_expiry = 3600
max_frequency = "60s"

[auth.email.template.confirmation]
subject = "Your Sauti Salama code / Msimbo wako"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Sauti Salama password / Badilisha nenosiri"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirm your new email / Thibitisha barua pepe mpya"
content_path = "./supabase/templates/email_change.html"

# Local emails are caught by Mailpit: http://127.0.0.1:54424
