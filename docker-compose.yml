services:
  sauti-salama:
    build:
      context: .
      dockerfile: Dockerfile
      # Public browser values baked into the client bundle (read from .env).
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID}
    container_name: sauti-salama
    restart: unless-stopped
    # Only reachable through nginx on the same host (see nginx/sauti-salama.conf).
    ports:
      - "127.0.0.1:${HOST_PORT:-3100}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional: add Mentora Tanzania as a second service if you containerize it.
  # Uncomment and adjust the build/image and port once Mentora has its own Dockerfile.
  #
  # mentora:
  #   image: mentora-tanzania:latest   # or build: ./mentora
  #   container_name: mentora
  #   restart: unless-stopped
  #   ports:
  #     - "8080:80"
  #   # volumes, env, etc.

# Optional shared network if you want Nginx on the host or in another container to reach both
networks:
  default:
    name: sauti-mentora-net
