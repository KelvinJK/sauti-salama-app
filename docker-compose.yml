services:
  sauti-salama:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sauti-salama
    restart: unless-stopped
    ports:
      # Optional container deployment only. Existing systemd Sauti uses 3100; Mentora uses 3000.
      - "127.0.0.1:3200:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional: add Mentora Tanzania as a second service if you containerize it.
  # Uncomment and adjust the build/image and port once Mentora has its own Dockerfile.
  #
  # mentora:
  #   image: mentora-tanzania:latest   # or build: ./mentora
  #   container_name: mentora
  #   restart: unless-stopped
  #   ports:
  #     - "8080:80"
  #   # volumes, env, etc.

# Optional shared network if you want Nginx on the host or in another container to reach both
networks:
  default:
    name: sauti-mentora-net
