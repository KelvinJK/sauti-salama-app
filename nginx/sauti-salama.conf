# Example Nginx config for Hostinger VPS
# Place in /etc/nginx/sites-available/sauti-salama and symlink to sites-enabled
# Does not touch existing Mentora server blocks.

server {
    listen 80;
    server_name app.sautisalama.health;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# After testing, run:
# sudo certbot --nginx -d app.sautisalama.health
