# Nginx config for Sauti Salama on the Hostinger VPS.
# Install:  sudo cp nginx/sauti-salama.conf /etc/nginx/sites-available/sauti-salama
#           sudo ln -s /etc/nginx/sites-available/sauti-salama /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
# TLS:      sudo certbot --nginx -d sautisalama.health -d www.sautisalama.health -d app.sautisalama.health
# This file only defines Sauti Salama hosts; other sites (e.g. Mentora) are untouched.
# The app container listens on 127.0.0.1:3100 (HOST_PORT in .env).

upstream sauti_salama {
    server 127.0.0.1:3100;
    keepalive 16;
}

# www -> apex
server {
    listen 80;
    server_name www.sautisalama.health;
    return 301 https://sautisalama.health$request_uri;
}

server {
    listen 80;
    server_name sautisalama.health app.sautisalama.health;

    client_max_body_size 2m;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # Fingerprinted build assets never change: cache for a year.
    location /assets/ {
        proxy_pass http://sauti_salama;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://sauti_salama;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Always overwrite forwarded headers so clients cannot spoof them.
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
